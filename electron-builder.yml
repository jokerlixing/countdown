appId: com.lixing.desktopcountdown
productName: 桌面倒计时
copyright: Copyright © 2026 lixing
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron/*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc*,lint-staged.config.js}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
asarUnpack:
  - resources/**
win:
  icon: resources/icons/icon.ico
  executableName: DesktopCountdown
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 桌面倒计时
mac:
  icon: resources/icons/icon.png
  category: public.app-category.productivity
  artifactName: ${productName}-macOS-${version}-${arch}.${ext}
  # 无开发者证书时不尝试签名（正式分发请在 macOS 上配置签名与公证）
  identity: null
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
extraResources:
  - from: resources/
    to: resources/
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
